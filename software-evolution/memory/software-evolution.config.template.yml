# AI Software Evolution Agent project control plane.
# This restricted YAML file supports mappings and scalar values only.
version: 1
memory_dir: docs/software-evolution

autonomy:
  max_risk: R2
  allow_product_writes: true

autopilot:
  max_runtime_minutes: 240
  max_cycles: 8
  max_budget_windows: 4
  max_total_files_changed: 48
  max_consecutive_failed_batches: 2
  checkpoint_every_batch: true
  continue_after_budget_checkpoint: true

# Normal Autopilot budget window. Reaching this window checkpoint does not
# stop the invocation while the Autopilot session budget still permits work.
budget:
  max_scope_items: 60
  max_findings: 12
  max_repair_batches: 2
  max_files_changed: 12
  max_governance_files_changed: 24
  reserve_verification_minutes: 15

deep_budget:
  max_scope_items: 200
  max_findings: 40
  max_repair_batches: 3
  max_files_changed: 24
  max_governance_files_changed: 48
  reserve_verification_minutes: 30

overnight_budget:
  max_runtime_minutes: 480
  max_cycles: 12
  max_scope_items: 500
  max_findings: 80
  max_repair_batches: 8
  max_files_changed: 60
  max_governance_files_changed: 96
  max_consecutive_failed_batches: 2
  reserve_verification_minutes: 45

readonly:
  allow_record_persistence: true

release:
  require_required_checks: true
  require_rollback_plan: true
  require_mixed_version_check: true

observe:
  production_read_only: true
  default_window_minutes: 30

specialist_routing:
  security: auto
  supply_chain: auto
  data: auto
  performance_cost: auto
  ux: auto
  database: auto
  ci_cd: auto

fitness:
  enforce_registered_checks: true
